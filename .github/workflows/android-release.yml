name: Android Release

# Cut a release by pushing a tag such as android-v1.0.0 (must equal android/app versionName),
# or run the workflow manually from the Actions tab. See android/RELEASING.md.
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed AAB and APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the GitHub Release
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches versionName
        working-directory: .
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version_name=$(grep -E '^\s*versionName = ' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "versionName in build.gradle.kts: $version_name"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "android-v$version_name" ]; then
            echo "::error::Tag $REF_NAME does not match versionName $version_name (expected android-v$version_name)"
            exit 1
          fi

      - name: Check required signing secrets
        run: |
          missing=0
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing secret for $var"
              missing=1
            fi
          done
          exit $missing

      - name: Decide whether to upload to Google Play
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_SERVICE_ACCOUNT_JSON not set; skipping Google Play upload."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode upload keystore
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build, test and sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew testDebugUnitTest bundleRelease assembleRelease
          -PVERSION_CODE=${{ github.run_number }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload release AAB and APK as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB to Google Play internal track
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tengmo.vader
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
